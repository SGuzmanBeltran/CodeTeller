services:
  codeteller:
    image: ghcr.io/sguzmanbeltran/codeteller:latest
    container_name: codeteller
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
